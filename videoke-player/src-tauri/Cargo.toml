[package]
name = "videoke-player"
version = "1.0.0"
description = "Lightweight offline media player for low-spec PCs"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
tauri = { version = "1", features = ["api-all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2"
fxhash = "0.2"

[features]
custom-protocol = ["tauri/custom-protocol"]
